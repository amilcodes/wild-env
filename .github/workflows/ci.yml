name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[geo,met,render,dev]'
      - name: Lint
        run: ruff check src tests tools examples
      - name: Test
        run: pytest -q
      - name: Agent benchmark smoke and replay
        run: |
          aeolus-agent-bench run --suite configs/agents/smoke.yaml --out runs/ci-desk
          aeolus-agent-bench replay runs/ci-desk/episode-0000.jsonl

  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure
