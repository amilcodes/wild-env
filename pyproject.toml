[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aeolus-ia"
version = "0.7.0"
description = "Research environment for constrained multi-agent wildfire initial attack and suppression operations"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Aeolus-IA research"}]
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "gymnasium>=1.0,<2",
  "pettingzoo>=1.24,<2",
  "torch>=2.5,<3",
  "certifi>=2025.1",
]

[project.optional-dependencies]
rllib = ["ray[rllib]>=2.55,<2.57"]
geo = [
  "pyshp>=2.3,<3",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "xarray>=2025.1,<2027",
  "scipy>=1.15,<2",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "zarr>=2.18,<3",
]
render = [
  "matplotlib>=3.10,<4",
  "pillow>=11,<13",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
]
viewer = [
  "matplotlib>=3.10,<4",
  "pillow>=11,<13",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "zarr>=2.18,<3",
  "rasterio>=1.4,<2",
  "PySide6>=6.8,<7",
  "pyvista>=0.46,<0.49",
  "pyvistaqt>=0.11,<0.12",
  "qtpy>=2.4,<3",
]
paper = ["reportlab>=4.4,<5"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
fire-reference = [
  "pyretechnics==2025.5.15; python_version >= '3.11' and python_version < '3.12'",
]
met = [
  "s3fs>=2025.3,<2027",
  "zarr>=2.18,<3",
  "scipy>=1.15,<2",
  "pyproj>=3.7,<4",
  "affine>=2.4,<3",
]

[project.scripts]
aeolus-train = "aeolus.training.train:main"
aeolus-eval = "aeolus.evaluation.evaluate:main"
aeolus-rollout = "aeolus.cli:rollout_main"
aeolus-incident = "aeolus.incident_cli:main"
aeolus-historical = "aeolus.historical_cli:main"
aeolus-replay = "aeolus.replay_cli:main"
aeolus-view = "aeolus.viewer_cli:main"
aeolus-benchmark = "aeolus.benchmark_cli:main"
aeolus-fire = "aeolus.fire_cli:main"
aeolus-study = "aeolus.study_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeolus = ["resources/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
