# Mechanism test: ground-connected retardant and water support can convert a
# low-wind initial attack from an unresolved spread to containment.
scenario:
  seed: 3
  width: 48
  height: 48
  cell_size_m: 60.0
  horizon_min: 90
  decision_interval_min: 3
  max_tasks: 24
  observation_delay_min: 2
  wind_speed_m_s: 0.6
  wind_direction_deg: 25.0
  wind_variability: 0.10
  spotting_rate: 0.0
  ground_arrival_min: 8
training:
  device: auto
  num_envs: 8
  rollout_steps: 32
  updates: 4
  epochs_per_update: 2
  minibatch_size: 64
  checkpoint_dir: runs/mechanism
