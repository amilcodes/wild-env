schema_version: 1
suite_id: wildfire-desk-frontier-v1
split: evaluation
description: Public synthetic pilot across four operational challenges. No human comparator or historical skill claim.
scenario:
  scenario_id: desk-frontier
  title: Frontier incident desk
  width: 40
  height: 40
  cell_size_m: 80.0
  horizon_min: 90
  decision_interval_min: 3
  max_tasks: 32
  observation_delay_min: 3
  wind_speed_m_s: 5.0
  wind_direction_deg: 25.0
  wind_variability: 0.20
  spotting_rate: 0.005
  ground_arrival_min: 15
  terminate_on_escape: false
  service_sites:
    - site_id: airbase
      kind: airport
      x: 5
      y: 33
      services: [water, retardant, fuel]
      service_mode: land
      bays: 2
      approach_capacity: 3
      refill_rate_l_min: 1800.0
      fixed_turnaround_min: 3.0
      available_volume_l: 150000.0
    - site_id: reservoir
      kind: dip_site
      x: 31
      y: 27
      services: [water]
      service_mode: hover_fill
      bays: 1
      approach_capacity: 2
      refill_rate_l_min: 3500.0
      available_volume_l: 80000.0
      minimum_depth_m: 2.0
  resources:
    - resource_id: tanker
      kind: retardant
      cruise_speed_m_s: 65.0
      payload_l: 6000.0
      reload_min: 9
      dispatch_latency_min: 2
      endurance_min: 150
      home_site_id: airbase
      max_operating_wind_m_s: 18.0
    - &helicopter
      resource_id: helicopter-1
      kind: water
      cruise_speed_m_s: 45.0
      payload_l: 2200.0
      reload_min: 5
      dispatch_latency_min: 1
      endurance_min: 95
      reserve_endurance_min: 18.0
      home_site_id: airbase
      service_modes: [land, hover_fill]
      max_operating_wind_m_s: 12.0
    - <<: *helicopter
      resource_id: helicopter-2
    - resource_id: scout
      kind: sensor
      cruise_speed_m_s: 38.0
      payload_l: 0.0
      reload_min: 0
      dispatch_latency_min: 1
      endurance_min: 110
      home_site_id: airbase
      max_operating_wind_m_s: 20.0
    - resource_id: crew
      kind: crew
      cruise_speed_m_s: 1.3
      payload_l: 0.0
      reload_min: 0
      dispatch_latency_min: 15
      endurance_min: 600
      line_production_m_min: 6.0
      line_length_m: 500.0
      max_operating_wind_m_s: 30.0
cases:
  - id: initial-attack
    capability: heterogeneous-fleet-coordination
    seeds: [101, 211, 307]
    overrides: {}
  - id: delayed-recon
    capability: information-gathering-and-memory
    seeds: [401, 503, 601]
    overrides:
      observation_delay_min: 12
      wind_speed_m_s: 7.0
  - id: wind-restrictions
    capability: constraint-aware-planning
    seeds: [701, 809, 907]
    overrides:
      wind_speed_m_s: 14.0
      wind_direction_deg: 60.0
      relative_humidity_pct: 16.0
  - id: scarce-reload
    capability: long-horizon-logistics
    seeds: [1009, 1103, 1201]
    overrides:
      service_sites:
        - site_id: airbase
          kind: airport
          x: 5
          y: 33
          services: [water, retardant, fuel]
          service_mode: land
          bays: 1
          approach_capacity: 2
          refill_rate_l_min: 900.0
          fixed_turnaround_min: 6.0
          available_volume_l: 12000.0
        - site_id: reservoir
          kind: dip_site
          x: 31
          y: 27
          services: [water]
          service_mode: hover_fill
          bays: 1
          approach_capacity: 1
          refill_rate_l_min: 2200.0
          available_volume_l: 8800.0
          close_minute: 45
          minimum_depth_m: 2.0
